<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>{{ title if title else "Explainable AI" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='bootstrap/css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='styles/css/style.css') }}">
</head>

<body>
  <header>
    <nav>
      <section class="togglers-container">
        <form id="upload" action="/upload" method="post" enctype="multipart/form-data">
          <label id="upload-button" for="file-input" class="file-label">
            <img src="../static/assets/icons/image_icon.svg">
          </label>
          <input id="file-input" type="file" name="file" accept="image/png, image/jpeg" style="display:none;" required
            onchange="document.getElementById('upload').submit();" /> Upload
        </form>
        <form action="/classify" method="post">
          <input type="hidden" name="image_url" value="{{ image_url }}" />
          <button id="classify-button" type="submit"><img src="../static/assets/icons/share_icon.svg" id="share-1"><img
              src="../static/assets/icons/share_icon.svg" id="share-2"><img src="../static/assets/icons/share_icon.svg"
              id="share-3"></button> <span id="classify-text">Classify</span>
        </form>
          <div>
              <button onclick="openExplanationModal()" id="explain-button">
                  <img src="../static/assets/icons/comment_icon.svg">
              </button>Explain
          </div>
      </section>
    </nav>
  </header>
  <main>
    <header>
      <h1>Explainable AI</h1>
    </header>
    <section class="content">
      {% block content %}
      <br />
      {% endblock %}
  </main>
  </main>
</body>

<script src="{{ url_for('static', path='bootstrap/js/bootstrap.bundle.min.js') }}"></script>

<script>
    function openExplanationModal() {
        document.getElementById("explainModal").style.display = "block";
    }

    function closeExplanationModal() {
        document.getElementById("explainModal").style.display = "none";
    }
</script>
</html>
